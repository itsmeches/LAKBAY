<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1420" viewBox="0 0 1750 1420" role="img" aria-label="Whole-system workflow"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#456784"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect width="1750" height="12" fill="#184a79"/><text x="875.0" y="58.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="16" fill="#547089" font-weight="700">LAKBAY / CHED REGION IV-A</text><text x="875.0" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#17334c" font-weight="700">Whole-system workflow</text><text x="875.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">Three responsibilities / immutable receipts / distinct external authority</text><rect x="65" y="212" width="500" height="58" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="315.0" y="241.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">HEI: prepare and file</text><rect x="625" y="212" width="500" height="58" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="875.0" y="241.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">CHED: review and record</text><rect x="1185" y="212" width="500" height="58" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="1435.0" y="241.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">After activity / follow-up</text><rect x="65" y="310" width="500" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="315.0" y="365.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Plan / classify / consult</text><rect x="65" y="460" width="500" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="315.0" y="515.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Prepare forms and applicable requirements</text><rect x="65" y="610" width="500" height="110" rx="16" fill="#fff5df" stroke="#d4a94d" stroke-width="2"/><text x="315.0" y="650.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">External HEI authorization / signing /</text><text x="315.0" y="679.3000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">notarization</text><rect x="65" y="760" width="500" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="315.0" y="800.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Upload private evidence; genuine scan</text><text x="315.0" y="829.3000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">succeeds</text><rect x="65" y="910" width="500" height="110" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="315.0" y="950.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Submit: freeze receipt, activity versions</text><text x="315.0" y="979.3000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">and evidence</text><rect x="625" y="910" width="500" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="875.0" y="950.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">CHED reviews the exact receipt for</text><text x="875.0" y="979.3000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">completeness</text><rect x="625" y="610" width="500" height="110" rx="16" fill="#fff0ed" stroke="#d18b7e" stroke-width="2"/><text x="875.0" y="650.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Deficiencies: request correction; HEI</text><text x="875.0" y="679.3000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">files a new revision</text><rect x="625" y="1170" width="500" height="110" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="875.0" y="1210.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Complete: signatory records signed</text><text x="875.0" y="1239.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">acknowledgment</text><rect x="1185" y="310" width="500" height="110" rx="16" fill="#fff5df" stroke="#d4a94d" stroke-width="2"/><text x="1435.0" y="350.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">HEI conducts under its authorization,</text><text x="1435.0" y="379.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">restrictions and applicable clearance</text><rect x="1185" y="520" width="500" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="1435.0" y="560.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">File ROC / incidents / changes; preserve</text><text x="1435.0" y="589.3000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">evidence</text><rect x="1185" y="730" width="500" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="1435.0" y="770.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">CHED monitoring, assistance and HEI</text><text x="1435.0" y="799.3000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">corrective follow-up</text><rect x="1185" y="940" width="500" height="110" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="1435.0" y="980.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Regional snapshots / exports; record OSDS</text><text x="1435.0" y="1009.3000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">dispatch / receipt</text><polyline points="315.0,420 315.0,460" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="315.0,570 315.0,610" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="315.0,720 315.0,760" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="315.0,870 315.0,910" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1435.0,420 1435.0,520" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1435.0,630 1435.0,730" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1435.0,840 1435.0,940" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="565,965 625,965" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="875.0,1060 1100,1100.0 875.0,1140 650,1100.0" fill="#fff5df" stroke="#d4a94d" stroke-width="2"/><text x="875.0" y="1100.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Deficiencies?</text><polyline points="875,1020 875,1060" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="875,1140 875,1170" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="899.0" y="1145.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">No</text><polyline points="650,1100 590,1100 590,665 625,665" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="644.0" y="1090.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">Yes</text><polyline points="625,665 590,665 590,515 565,515" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="631.5" y="655.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">Revise</text><polyline points="565,965 575,965 575,285 1140,285 1140,365 1185,365" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="875" y="307.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">Separate conduct readiness checks</text><rect x="1185" y="1170" width="500" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="1435.0" y="1196.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Restricted case officer records external</text><text x="1435.0" y="1225.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Committee / CEB procedure; no automatic</text><text x="1435.0" y="1253.6000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">suspension</text><rect x="65" y="1170" width="500" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="315.0" y="1196.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Administrator: invitations / reference</text><text x="315.0" y="1225.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">controls. Analyst: regional snapshots and</text><text x="315.0" y="1253.6000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">exports.</text><text x="875.0" y="1340.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">Acknowledgment is receipt/completeness, not conduct authorization. OSDS/CEB work and signing remain</text><text x="875.0" y="1363.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">external.</text><text x="875.0" y="1395.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" fill="#547089" font-weight="400">Current development baseline / 12 October 2026 / CMO 24 candidate; not production activation</text></svg>