<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1362" viewBox="0 0 1140 1362" role="img" aria-label="HEI Submitter"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#456784"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect width="1140" height="12" fill="#184a79"/><text x="570.0" y="58.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="16" fill="#547089" font-weight="700">LAKBAY / CHED REGION IV-A</text><text x="570.0" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#17334c" font-weight="700">HEI Submitter</text><text x="570.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">Main path on the left / alternatives on the right / external work in amber</text><rect x="70" y="205" width="1000" height="54" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="570.0" y="232.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Entry: active verified account + panel MFA + institution / regional permission</text><rect x="70" y="290" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="338.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Inspect own HEI plan and applicable policy</text><rect x="70" y="434" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="482.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Confirm saved classification when selected</text><polyline points="355.0,386 355.0,434" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="70" y="578" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="626.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Attach applicable clean signed evidence</text><polyline points="355.0,530 355.0,578" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="355,674 355,722" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="355.0,722 640,807.0 355.0,892 70,807.0" fill="#fff5df" stroke="#d4a94d" stroke-width="2"/><text x="355.0" y="807.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Authorized and checklist complete?</text><rect x="750" y="752" width="320" height="130" rx="16" fill="#fff0ed" stroke="#d18b7e" stroke-width="2"/><text x="910.0" y="788.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Correct draft / obtain</text><text x="910.0" y="817.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">missing evidence; then</text><text x="910.0" y="845.6" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">retry</text><polyline points="640,807 750,807" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="719.0" y="797.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">No</text><polyline points="355,892 355,952" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="379.0" y="912.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">Yes</text><rect x="70" y="952" width="570" height="110" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="355.0" y="1007.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">File frozen receipt and exact activity versions</text><rect x="70" y="1117" width="570" height="110" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="1157.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Respond to corrections / resubmit; read</text><text x="355.0" y="1186.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">acknowledgment; file ROC, incidents and changes</text><polyline points="355,1062 355,1117" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1070,817 1100,817 1100,338 640,338" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="570.0" y="1294.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">Corrections create a new receipt. Acknowledgment does not authorize conduct.</text><text x="570.0" y="1337.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" fill="#547089" font-weight="400">Current development baseline / 12 October 2026 / CMO 24 candidate; not production activation</text></svg>