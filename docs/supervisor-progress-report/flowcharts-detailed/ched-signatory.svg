<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1341" viewBox="0 0 1140 1341" role="img" aria-label="CHED Signatory"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#456784"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect width="1140" height="12" fill="#184a79"/><text x="570.0" y="58.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="16" fill="#547089" font-weight="700">LAKBAY / CHED REGION IV-A</text><text x="570.0" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#17334c" font-weight="700">CHED Signatory</text><text x="570.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">Main path on the left / alternatives on the right / external work in amber</text><rect x="70" y="205" width="1000" height="54" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="570.0" y="232.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Entry: active verified account + panel MFA + institution / regional permission</text><rect x="70" y="290" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="338.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Open complete calendar submission</text><rect x="70" y="434" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="482.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Prepare Annex K recipient / Director details</text><polyline points="355.0,386 355.0,434" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="70" y="578" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="626.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Inspect originals and preview unsigned letter</text><polyline points="355.0,530 355.0,578" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="70" y="722" width="570" height="96" rx="16" fill="#fff5df" stroke="#d4a94d" stroke-width="2"/><text x="355.0" y="770.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Sign externally; upload official signed PDF</text><polyline points="355.0,674 355.0,722" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="355,818 355,866" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="355.0,866 640,951.0 355.0,1036 70,951.0" fill="#fff5df" stroke="#d4a94d" stroke-width="2"/><text x="355.0" y="951.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Complete receipt and clean signed letter?</text><rect x="750" y="896" width="320" height="130" rx="16" fill="#fff0ed" stroke="#d18b7e" stroke-width="2"/><text x="910.0" y="932.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Resolve missing</text><text x="910.0" y="961.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">particulars / evidence; do</text><text x="910.0" y="989.6" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">not issue</text><polyline points="640,951 750,951" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="719.0" y="941.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">No</text><polyline points="355,1036 355,1096" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="379.0" y="1056.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">Yes</text><rect x="70" y="1096" width="570" height="110" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="355.0" y="1151.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Record acknowledgment tied to the exact receipt</text><polyline points="1070,961 1100,961 1100,338 640,338" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="570.0" y="1273.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">Annex K confirms receipt / completeness, not permission to conduct.</text><text x="570.0" y="1316.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" fill="#547089" font-weight="400">Current development baseline / 12 October 2026 / CMO 24 candidate; not production activation</text></svg>