<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1485" viewBox="0 0 1140 1485" role="img" aria-label="HEI Preparer"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#456784"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect width="1140" height="12" fill="#184a79"/><text x="570.0" y="58.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="16" fill="#547089" font-weight="700">LAKBAY / CHED REGION IV-A</text><text x="570.0" y="106.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="32" fill="#17334c" font-weight="700">HEI Preparer</text><text x="570.0" y="160.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">Main path on the left / alternatives on the right / external work in amber</text><rect x="70" y="205" width="1000" height="54" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="570.0" y="232.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Entry: active verified account + panel MFA + institution / regional permission</text><rect x="70" y="290" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="338.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Open own HEI calendar / activity</text><rect x="70" y="434" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="467.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Encode activity facts and Annex B-F / J</text><text x="355.0" y="496.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">preparations</text><polyline points="355.0,386 355.0,434" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="70" y="578" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="626.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Preview / print unsigned forms</text><polyline points="355.0,530 355.0,578" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="70" y="722" width="570" height="96" rx="16" fill="#fff5df" stroke="#d4a94d" stroke-width="2"/><text x="355.0" y="770.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Arrange external authorization and signing</text><polyline points="355.0,674 355.0,722" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="70" y="866" width="570" height="96" rx="16" fill="#eef5fb" stroke="#bed1e3" stroke-width="2"/><text x="355.0" y="914.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Upload evidence; wait for genuine scan</text><polyline points="355.0,818 355.0,866" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="355,962 355,1010" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="355.0,1010 640,1095.0 355.0,1180 70,1095.0" fill="#fff5df" stroke="#d4a94d" stroke-width="2"/><text x="355.0" y="1095.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Preparation and evidence ready?</text><rect x="750" y="1040" width="320" height="130" rx="16" fill="#fff0ed" stroke="#d18b7e" stroke-width="2"/><text x="910.0" y="1076.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Keep draft / correct</text><text x="910.0" y="1105.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">missing fields or wait for</text><text x="910.0" y="1133.6000000000001" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">scan</text><polyline points="640,1095 750,1095" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="719.0" y="1085.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">No</text><polyline points="355,1180 355,1240" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="379.0" y="1200.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#17334c" font-weight="700">Yes</text><rect x="70" y="1240" width="570" height="110" rx="16" fill="#e6f5ee" stroke="#6daa8b" stroke-width="2"/><text x="355.0" y="1280.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">Hand prepared records to authorized HEI</text><text x="355.0" y="1309.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="22" fill="#17334c" font-weight="400">submitter</text><polyline points="1070,1105 1100,1105 1100,338 640,338" fill="none" stroke="#456784" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="570.0" y="1417.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="18" fill="#547089" font-weight="400">Can prepare and upload. This role cannot file submissions or reports.</text><text x="570.0" y="1460.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="14" fill="#547089" font-weight="400">Current development baseline / 12 October 2026 / CMO 24 candidate; not production activation</text></svg>