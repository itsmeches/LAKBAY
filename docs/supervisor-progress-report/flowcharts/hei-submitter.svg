"14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="596.0" r="22" fill="#244e69"/><text x="128" y="604.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">3</text><text x="185" y="582.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">CHECK</text><text x="185" y="620.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Confirm authority and required evidence</text><path d="M600 664 L600 684" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="689" width="1020" height="130" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="754.0" r="22" fill="#244e69"/><text x="128" y="762.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">4</text><text x="185" y="740.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">SUBMIT</text><text x="185" y="778.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">File the completed package</text><path d="M600 822 L600 842" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="847" width="1020" height="130" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="912.0" r="22" fill="#244e69"/><text x="128" y="920.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">5</text><text x="185" y="898.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">FOLLOW UP</text><text x="185" y="936.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">View review messages and acknowledgment</text><path d="M600 980 L600 1000" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="1005" width="1020" height="130" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="1070.0" r="22" fill="#244e69"/><text x="128" y="1078.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">6</text><text x="185" y="1056.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">REPORT</text><text x="185" y="1094.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">File completion, incident or change reports</text><path d="M600 1138 L600 1158" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="1163" width="1020" height="130" rx="14" fill="#ebf5ef" stroke="#c7ded1"/><circle cx="135" cy="1228.0" r="22" fill="#244e69"/><text x="128" y="1236.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">7</text><text x="185" y="1214.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">OUTCOME</text><text x="185" y="1252.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Keep the activity record up to date</text><path d="M90 1370 H1110" stroke="#d2e0e8"/><text x="90" y="1410" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#597386">KEEP IN MIND</text><text x="90" y="1450" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">If CHED requests corrections: revise and submit a new package.</text><text x="90" y="1482" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">Only successfully scanned evidence is retrievable; filed versions stay unchanged.</text><text x="90" y="1514" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">Acknowledgment confirms receipt/completeness, not authorization to conduct.</text><text x="90" y="1600" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#597386">Current app baseline: 741f29d  |  12 October 2026  |  CMO 24 candidate</text></svg>