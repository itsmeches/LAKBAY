<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" role="img" aria-label="System Administrator"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8094a4" stroke-width="2"/></marker></defs><rect width="1200" height="1640" fill="#ffffff"/><text x="90" y="55" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#597386">LAKBAY  /  CHED REGION IV-A</text><text x="90" y="115" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#19354b">System Administrator</text><text x="90" y="158" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#597386">Maintain institutions, invitations and controls</text><rect x="90" y="215" width="1020" height="130" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="280.0" r="22" fill="#244e69"/><text x="128" y="288.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">1</text><text x="185" y="266.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">START</text><text x="185" y="304.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Sign in to the CHED workspace</text><path d="M600 348 L600 368" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="373" width="1020" height="130" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="438.0" r="22" fill="#244e69"/><text x="128" y="446.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">2</text><text x="185" y="424.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">MAINTAIN</text><text x="185" y="462.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Manage regional institutions and campuses</text><path d="M600 506 L600 526" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="531" width="1020" height="130" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="596.0" r="22" fill="#244e69"/><text x="128" y="604.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">3</text><text x="185" y="582.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">INVITE</text><text x="185" y="620.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Invite personnel with supported roles</text><path d="M600 664 L600 684" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="689" width="1020" height="130" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="754.0" r="22" fill="#244e69"/><text x="128" y="762.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">4</text><text x="185" y="740.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">ONBOARDING</text><text x="185" y="778.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Personnel accept and enroll in MFA</text><path d="M600 822 L600 842" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="847" width="1020" height="130" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="912.0" r="22" fill="#244e69"/><text x="128" y="920.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">5</text><text x="185" y="898.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">CHECK</text><text x="185" y="936.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Inspect policy and publication controls</text><path d="M600 980 L600 1000" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="1005" width="1020" height="130" rx="14" fill="#ebf5ef" stroke="#c7ded1"/><circle cx="135" cy="1070.0" r="22" fill="#244e69"/><text x="128" y="1078.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">6</text><text x="185" y="1056.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">OUTCOME</text><text x="185" y="1094.0" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Maintain accounts and reference records</text><path d="M90 1370 H1110" stroke="#d2e0e8"/><text x="90" y="1410" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#597386">KEEP IN MIND</text><text x="90" y="1450" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">CMO 24 remains a candidate; activation requires verified publication and authority.</text><text x="90" y="1482" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">Administration does not grant access to confidential cases.</text><text x="90" y="1514" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">No policy activation is part of this journey.</text><text x="90" y="1600" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#597386">Current app baseline: 741f29d  |  12 October 2026  |  CMO 24 candidate</text></svg>