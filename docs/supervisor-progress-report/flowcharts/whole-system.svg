<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" role="img" aria-label="Whole-system journey"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8094a4" stroke-width="2"/></marker></defs><rect width="1200" height="1640" fill="#ffffff"/><text x="90" y="55" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#597386">LAKBAY  /  CHED REGION IV-A</text><text x="90" y="115" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#19354b">Whole-system journey</text><text x="90" y="158" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#597386">From HEI planning to regional reporting</text><rect x="90" y="215.0" width="1020" height="95.66666666666667" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="262.8333333333333" r="22" fill="#244e69"/><text x="128" y="270.8333333333333" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">1</text><text x="185" y="248.83333333333331" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">HEI PREPARER</text><text x="185" y="286.8333333333333" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Plan and classify the activity</text><path d="M600 313.6666666666667 L600 333.6666666666667" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="338.6666666666667" width="1020" height="95.66666666666667" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="386.5" r="22" fill="#244e69"/><text x="128" y="394.5" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">2</text><text x="185" y="372.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">HEI PREPARER</text><text x="185" y="410.5" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Prepare forms and required evidence</text><path d="M600 437.33333333333337 L600 457.33333333333337" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="462.33333333333337" width="1020" height="95.66666666666667" rx="14" fill="#fff7e8" stroke="#ead8b0"/><circle cx="135" cy="510.1666666666667" r="22" fill="#244e69"/><text x="128" y="518.1666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">3</text><text x="185" y="496.1666666666667" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">AUTHORIZED HEI OFFICIAL</text><text x="185" y="534.1666666666667" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Authorize and sign outside the app</text><path d="M600 561.0 L600 581.0" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="586.0" width="1020" height="95.66666666666667" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="633.8333333333334" r="22" fill="#244e69"/><text x="128" y="641.8333333333334" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">4</text><text x="185" y="619.8333333333334" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">HEI SUBMITTER</text><text x="185" y="657.8333333333334" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Upload evidence; wait for a clean scan</text><path d="M600 684.6666666666667 L600 704.6666666666667" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="709.6666666666667" width="1020" height="95.66666666666667" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="757.5000000000001" r="22" fill="#244e69"/><text x="128" y="765.5000000000001" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">5</text><text x="185" y="743.5000000000001" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">HEI SUBMITTER</text><text x="185" y="781.5000000000001" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Submit the completed package</text><path d="M600 808.3333333333334 L600 828.3333333333334" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="833.3333333333334" width="1020" height="95.66666666666667" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="881.1666666666667" r="22" fill="#244e69"/><text x="128" y="889.1666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">6</text><text x="185" y="867.1666666666667" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">CHED REVIEWER</text><text x="185" y="905.1666666666667" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Review the submitted requirements</text><path d="M600 932.0 L600 952.0" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="957.0" width="1020" height="95.66666666666667" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="1004.8333333333334" r="22" fill="#244e69"/><text x="128" y="1012.8333333333334" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">7</text><text x="185" y="990.8333333333334" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">CHED SIGNATORY</text><text x="185" y="1028.8333333333335" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Record the signed acknowledgment</text><path d="M600 1055.6666666666667 L600 1075.6666666666667" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="1080.6666666666667" width="1020" height="95.66666666666667" rx="14" fill="#edf4f8" stroke="#d2e0e8"/><circle cx="135" cy="1128.5" r="22" fill="#244e69"/><text x="128" y="1136.5" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">8</text><text x="185" y="1114.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">HEI / HEI SUBMITTER</text><text x="185" y="1152.5" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Conduct the activity and file reports</text><path d="M600 1179.3333333333335 L600 1199.3333333333335" stroke="#8094a4" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="1204.3333333333335" width="1020" height="95.66666666666667" rx="14" fill="#ebf5ef" stroke="#c7ded1"/><circle cx="135" cy="1252.1666666666667" r="22" fill="#244e69"/><text x="128" y="1260.1666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">9</text><text x="185" y="1238.1666666666667" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#597386">CHED MONITOR / ANALYST</text><text x="185" y="1276.1666666666667" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#19354b">Monitor, follow up and report regionally</text><path d="M90 1370 H1110" stroke="#d2e0e8"/><text x="90" y="1410" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#597386">KEEP IN MIND</text><text x="90" y="1450" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">If incomplete: CHED requests corrections; HEI files a new submission.</text><text x="90" y="1482" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">Acknowledgment is not permission to conduct. HEI authority, restrictions</text><text x="90" y="1514" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#466172">and any required clearance independently govern conduct; this is the typical journey.</text><text x="90" y="1600" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#597386">Current app baseline: 741f29d  |  12 October 2026  |  CMO 24 candidate</text></svg>