name: lakbay-staging

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lakbay_staging
      POSTGRES_USER: lakbay_staging
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a unique staging DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakbay_staging -d lakbay_staging"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  staging_postgres:
